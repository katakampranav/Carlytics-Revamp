[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carlytics-backend"
version = "1.0.0"
description = "Carlytics — AI-Based Vehicle Resale Intelligence Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "shap>=0.45.0",
    "numba>=0.59.0",
    "transformers>=4.40.0",
    "Pillow>=10.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "python-multipart>=0.0.9",
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "openai>=1.30.0",
    "cerebras-cloud-sdk>=1.0.0",
    "mlflow>=2.14.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "catboost>=1.2.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.20.0",
    "nbformat>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ipykernel>=6.0.0"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

